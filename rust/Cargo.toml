# The published Rust SDK crates share one workspace, lockfile and toolchain.
[workspace]
resolver = "3"
members = [
    "http-transport",
    "sdk",
    "telemetry",
]

# What the crates published to crates.io share. `version` is the coming
# release's Rust version, derived from version.json (scripts/sdk_version.py
# write), beside the two paths below that name it, and in Cargo.lock;
# CI's `sdk_version.py check` fails any of them that carries another. A
# build packages its copy at that build's version.
[workspace.package]
version = "0.8.2"
repository = "https://github.com/xynolog/sdk"
# The oldest Rust that builds the crates, which is the highest rust-version
# of any crate Cargo.lock holds. rust-toolchain.toml is the Rust this
# repository builds and tests with.
rust-version = "1.89"

# Every crate a member uses, by version, once: a member names the ones it uses
# with `.workspace = true` and adds the features it needs.
[workspace.dependencies]
xynolog = { path = "sdk", version = "0.8.2" }
xynolog-http-transport = { path = "http-transport" }
xynolog-telemetry = { path = "telemetry", version = "0.8.2" }
async-nats = { version = "0.50.0", default-features = false }
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
encoding_rs = "0.8.42"
futures = "0.3.34"
futures-core = "0.3.34"
getrandom = "0.4.3"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.11.1"
hyper-util = "0.1.21"
jsonschema = { version = "0.60.0", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false }
log = "0.4.34"
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", default-features = false }
opentelemetry-otlp = { version = "0.33.0", default-features = false }
opentelemetry-stdout = { version = "0.33.0", default-features = false }
percent-encoding = "2.3.2"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rand_core = "0.10.1"
reqwest = { version = "0.13.5", default-features = false }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
serde-saphyr = "2.0.0"
socket2 = "0.6.5"
tikv-jemalloc-ctl = "0.7.0"
tikv-jemallocator = "0.7.0"
tokio = "1.53.1"
tokio-stream = { version = "0.1.19", default-features = false }
tower = "0.5.3"
unicode-normalization = "0.1.24"
uuid = "1.26.1"
windows-sys = "0.61.2"

[profile.release]
strip = true
lto = "thin"
