[package]
name = "xynolog-http-transport"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
description = "Xynolog's HTTP transport, in Rust: a knowledge base's bus over its gateway, as xynolog's Transport, and the sign-in that reaches it."
documentation = "https://docs.rs/xynolog-http-transport"
keywords = ["xynolog", "knowledge-base", "http", "sse", "oauth"]
categories = ["api-bindings", "web-programming::http-client", "authentication"]

# docs.rs builds the default features alone unless told otherwise: every
# feature here, so the docs show the whole API, and each item a feature adds
# is labelled with it (doc_cfg, under docs.rs's --cfg docsrs).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Signing a person in, and sessions over a gateway: the issuer's grants with
# PKCE, a registry's sign-in, the loopback redirect and discovery over HTTP.
# A service signs in as its own account, by its secret or its key, and
# leaves it off.
sign-in = ["tokio/net", "tokio/io-util"]

[dependencies]
base64.workspace = true
bytes.workspace = true
futures.workspace = true
# The random source a caller gives, which every jitter draws from.
rand_core.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
ring.workspace = true
xynolog.workspace = true
xynolog-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json"] }
http-body-util.workspace = true
# The telemetry tests install an OpenTelemetry of their own, as an application does.
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics", "testing"] }
proptest.workspace = true
# As an application builds its client: TLS on, and the provider its own choice.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std"] }
# The liveness harness and the bus log's capture.
xynolog = { workspace = true, features = ["testing"] }
# This crate's own tests sign people in.
xynolog-http-transport = { path = ".", features = ["sign-in"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { workspace = true, features = ["sync"] }
