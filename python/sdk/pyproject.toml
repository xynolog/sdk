[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xynolog"
dynamic = ["version"]
description = "The Python SDK for Xynolog, an open platform for building trusted AI knowledge bases"
readme = "README.md"
requires-python = ">=3.12"
# The licence's text is the repository's LICENSE, which
# python/sdk/scripts/build-python-sdk.sh copies beside this file before it builds:
# hatchling takes a file of that name as the distributions' licence file.
license = "Apache-2.0"
keywords = ["xynolog", "knowledge-base", "annotation", "agents", "sdk"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # RS256 for a service account that proves itself with a key (`xynolog.http.KeyCredential`).
    # No upper bound: cryptography takes a new major every few months, and a
    # cap would conflict with every project that takes the next one.
    "cryptography>=50",
    "httpx>=0.28,<1",
    # The API alone: it does nothing until the process it runs in installs a provider.
    "opentelemetry-api>=1.30,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
# What `xynolog.testing.axioms` and `xynolog.testing.liveness` import when their
# harnesses run: a program holds its own state units, and its own compositions
# over the bus, to the axioms this package's are held to. Nothing else in the
# package imports it, and every module imports without it.
axioms = ["hypothesis>=6.130,<7"]

[project.urls]
Homepage = "https://github.com/xynolog/sdk"
# The README as of the release, which sdk_version.py write keeps at the coming release's tag.
Documentation = "https://github.com/xynolog/sdk/tree/v0.8.1/python/sdk#readme"
Repository = "https://github.com/xynolog/sdk"
Issues = "https://github.com/xynolog/sdk/issues"
# Also at the coming release's tag: the changelog as of the release.
Changelog = "https://github.com/xynolog/sdk/blob/v0.8.1/python/sdk/CHANGELOG.md"

# The checkers, the formatter and the model generator are pinned to a version
# each: what they say of this package, and what the generator writes, is held
# by a gate, and a new version of one is a change of its own.
[dependency-groups]
# What only the conformance drivers take: an exporter for the telemetry the
# suite reads. The drivers are outside the wheel, and so is this.
conformance = [
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]
dev = [
    "hypothesis>=6.130,<7",
    "mypy==2.4.1",
    "pyright==1.1.414",
    "pytest>=9.1,<10",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

# `uv sync` makes the environment the checkers and the tests run in, and they
# read the drivers too. The suite's own, `uv sync --no-dev`, leaves `dev` out.
[tool.uv]
default-groups = ["conformance", "dev"]

# The checkout's version is the release's, from version.json, by the SDK's one
# derivation. A build stamps its copy with the version that build gives the
# package (python/sdk/scripts/build-python-sdk.sh).
[tool.hatch.version]
source = "code"
path = "../../scripts/sdk_version.py"
expression = 'released(config(), "python")'

[tool.hatch.build.targets.wheel]
packages = ["src/xynolog"]

# What the wheel is built from, and no more. The tests and the conformance
# drivers read the repository around this package, which a source distribution
# does not hold.
[tool.hatch.build.targets.sdist]
only-include = ["src/xynolog", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

# What `pytest --cov` measures: this package's own source, its paths relative to
# this directory, which `make test-python` names by the repository's
# (scripts/coverage-report.py) for Codecov.
[tool.coverage.run]
source = ["xynolog"]
relative_files = true

# No target-version: ruff takes it from requires-python.
[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "C4", "E", "F", "I", "PGH", "PT", "RUF", "SIM", "TID", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# A program that must not type-check is not otherwise good code.
"tests/refusals/*" = ["ANN", "B", "F", "RUF", "SIM"]

[tool.mypy]
# requires-python's floor, which mypy does not read. lint:python-version holds
# this, pyright's, the classifiers and CI's matrix to it.
python_version = "3.12"
files = ["src", "tests", "conformance"]
strict = true
# pydantic's own plugin, with each of its looser defaults turned off below: at
# its defaults a constructor takes anything, and a wrong kind of id would pass.
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["explicit-override", "ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests", "conformance"]
typeCheckingMode = "strict"
# `# type: ignore` is mypy's alone here; pyright is told by `# pyright: ignore[rule]`.
# Either left on a line that no longer needs it is an error, which is what
# holds tests/refusals: a program there that starts to type-check fails.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportMissingSuperCall = "none"
reportPropertyTypeMismatch = "error"
reportUnnecessaryCast = "error"
