name: CodeQL

# Code scanning of the languages the repository holds, under the categories
# default setup gave them, so each language's alerts keep their history. A
# pull request scans the languages of the SDKs it builds; main and the weekly
# run scan every one (scripts/codeql-analyses.py).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: The languages to scan
    runs-on: ubuntu-latest
    outputs:
      analyses: ${{ steps.analyses.outputs.analyses }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: List the CodeQL analyses to run
        id: analyses
        env:
          EVENT: ${{ github.event_name }}
        run: |
          languages="$(bash scripts/languages-to-build.sh "$EVENT")"
          main="$(bash scripts/languages-to-build.sh push)"
          analyses="$(python3 scripts/codeql-analyses.py "$languages" "$main")"
          echo "Scanning: $analyses"
          echo "analyses=$analyses" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.analyses != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.languages.outputs.analyses) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version-file: kotlin/sdk/.java-version

      - if: matrix.language == 'swift'
        name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL reads the compilations of the processes it traces: Gradle runs
      # in this step's own process, not a daemon's, and compiles every source
      # set.
      - if: matrix.language == 'java-kotlin'
        name: Compile the Kotlin SDK
        working-directory: kotlin/sdk
        run: ./gradlew --no-daemon --console=plain classes testClasses fromJavaClasses conformanceClasses

      - if: matrix.language == 'swift'
        name: Compile the Swift SDK
        run: swift build --package-path swift/sdk --build-tests

      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}
