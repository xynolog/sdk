name: Publish the SDK to a registry

# Library publishing (versioning R17, R18, R20): a person dispatches this at a
# released tag, one registry at a time, and approves it in the `release`
# environment:
#
#   gh workflow run publish.yml --ref v0.8.0 -f registry=pypi
#
# It publishes the bundle that tag's release workflow released, downloaded and
# checked against the release's digest, never a rebuild. Each registry trusts
# only this workflow in that environment (trusted publishing), so nothing here
# holds a registry credential. A registry that failed spends only its own
# version.
#
#   go      Go's release is the person's signed go/vX.Y.Z (scripts/tag-release.sh
#           go). This checks that tag, and that the module the Go proxy serves
#           is the one the bundle released.
#   pypi    the wheel and the source distribution
#   npm     the five TypeScript packages, in version.json's order
#   crates  the three Rust crates, dependencies first. cargo publishes only what
#           it packages itself, so this packages each crate from the tag as the
#           release did, and publishes none unless every archive is the bundle's.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: The registry to publish to
        type: choice
        required: true
        options: [go, pypi, npm, crates]

permissions: {}

jobs:
  version:
    name: The release this commit names
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      go: ${{ steps.tags.outputs.go }}
      release: ${{ steps.tags.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: tags
        run: |
          read -r -a tags <<< "$(python3 scripts/sdk_version.py tags)"
          {
            echo "tag=${tags[0]}"
            echo "go=${tags[1]}"
            echo "release=$(python3 scripts/sdk_version.py release)"
          } >> "$GITHUB_OUTPUT"

  tag:
    needs: version
    permissions:
      contents: read
    uses: xynolog/.github/.github/workflows/release-tag.yml@8e5e3b02c34517d3f8b49645330930983d07b7ac
    with:
      tags: ${{ inputs.registry == 'go' && format('{0} {1}', needs.version.outputs.tag, needs.version.outputs.go) || needs.version.outputs.tag }}

  bundle:
    name: The bundle this tag released
    needs: [version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: The release's digest, its languages and Protocol commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern "xynolog-sdk-artifacts-$TAG.tar.gz.sha256" --output - > "$RUNNER_TEMP/bundle.sha256"
          {
            echo "sha256=$(awk '{print $1}' "$RUNNER_TEMP/bundle.sha256")"
            echo "languages=$(sed -n 's/^LANGUAGES := //p' Makefile | tr -s ' ' ',')"
            echo "protocol=$(git ls-tree HEAD protocol | awk '{print $3}')"
          } >> "$GITHUB_OUTPUT"

      - name: Download the released bundle by its digest
        id: download
        uses: ./.github/actions/download-bundle
        with:
          tag: ${{ needs.version.outputs.tag }}
          commit: ${{ github.sha }}
          protocol-commit: ${{ steps.release.outputs.protocol }}
          sha256: ${{ steps.release.outputs.sha256 }}
          languages: ${{ steps.release.outputs.languages }}

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-artifacts
          path: ${{ steps.download.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true

  go:
    name: The Go proxy serves the released module
    if: inputs.registry == 'go'
    needs: [version, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
      - uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
      # Go hashes a module's files, not its zip's bytes, so the two sums agree
      # exactly when the proxy serves what the bundle released.
      - name: The proxy's module is the bundle's
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          module="github.com/xynolog/sdk/go@v$RELEASE"
          cd "$RUNNER_TEMP"
          released="$(GOPROXY="file://$BUNDLE/go/go-proxy" GONOSUMDB=github.com/xynolog/sdk/go GOFLAGS=-modcacherw GOMODCACHE="$RUNNER_TEMP/bundle-cache" go mod download -json "$module" | jq -r .Sum)"
          served="$(GOPROXY=https://proxy.golang.org GOFLAGS=-modcacherw GOMODCACHE="$RUNNER_TEMP/proxy-cache" go mod download -json "$module" | jq -r .Sum)"
          echo "bundle: $released"
          echo "proxy:  $served"
          test "$released" = "$served" || { echo "::error::the Go proxy serves $module with $served, not the released $released" >&2; exit 1; }

  pypi:
    name: PyPI
    if: inputs.registry == 'pypi'
    needs: bundle
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
      - name: The bundle's Python distributions
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
        shell: python3 {0}
        run: |
          import json, os, shutil
          bundle = os.environ["BUNDLE"]
          dist = os.path.join(os.environ["RUNNER_TEMP"], "dist")
          os.makedirs(dist)
          manifest = json.load(open(os.path.join(bundle, "artifacts.json")))
          for artifact in manifest["artifacts"]:
              if artifact["ecosystem"] == "python":
                  shutil.copy(os.path.join(bundle, artifact["path"]), dist)
                  print(artifact["path"])
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/dist

  npm:
    name: npm
    if: inputs.registry == 'npm'
    needs: bundle
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@12.2.2
      - uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
      - name: Publish each package, in version.json's order
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const { join } = require("node:path");
            const bundle = process.env.BUNDLE;
            const order = Object.entries(JSON.parse(readFileSync("version.json", "utf8")).packages)
              .filter(([, p]) => p.publish).map(([name]) => name);
            const artifacts = JSON.parse(readFileSync(join(bundle, "artifacts.json"), "utf8")).artifacts
              .filter((a) => a.ecosystem === "npm");
            for (const name of order) {
              const found = artifacts.filter((a) => a.package === name);
              if (found.length !== 1) { console.error(`the bundle holds ${found.length} packages named ${name}`); process.exit(1); }
              console.log(join(bundle, found[0].path));
            }
          ' > "$RUNNER_TEMP/npm-packages"
          while IFS= read -r package; do
            npm publish "$package" --access public
          done < "$RUNNER_TEMP/npm-packages"

  crates:
    name: crates.io
    if: inputs.registry == 'crates'
    needs: bundle
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
      # The image and version the release packaged the crates with, the image
      # pulled before there is a token.
      - name: The release's Rust image and crate version
        id: rust
        run: |
          image="rust:$(sh rust/scripts/rust-toolchain.sh)-bookworm"
          docker pull --quiet "$image"
          {
            echo "image=$image"
            echo "version=$(python3 scripts/sdk_version.py rust)"
          } >> "$GITHUB_OUTPUT"
      - name: A crates.io token for this run
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish each crate, if every one packages as the bundle's
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          IMAGE: ${{ steps.rust.outputs.image }}
          VERSION: ${{ steps.rust.outputs.version }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$GITHUB_WORKSPACE/protocol:/protocol:ro" \
            --volume "$BUNDLE:/bundle:ro" \
            --env CARGO_REGISTRY_TOKEN \
            --env CARGO_TARGET_DIR=/cargo-target \
            --workdir /source \
            "$IMAGE" bash /source/scripts/rust-crates.sh publish "$VERSION"
