name: Xynolog SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer run of the same event on the same ref supersedes an older one. A
# merge queue entry has a ref of its own, so entries never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit of a pull request is signed off by its author (the org's
  # CONTRIBUTING.md).
  dco:
    uses: xynolog/.github/.github/workflows/dco.yml@b3dcbb9f9db37476c2bd259711ebaac6df777fbf

  # On a push to main, the repository's labels become the org's.
  labels:
    uses: xynolog/.github/.github/workflows/labels.yml@6f4669cee4eb0a5e2ed0460c654a8a9f7f4bcb13
    permissions:
      issues: write

  checks:
    name: Make help, the source archive, and the SDK languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A pull request checks out its merge commit: the first parent is
          # the base, so HEAD^1..HEAD is the pull request's change.
          fetch-depth: 2
          submodules: true

      # A wrapper jar runs whatever it holds on every Gradle build; this holds
      # each one to a checksum Gradle publishes for a release of its own.
      - name: Every Gradle wrapper jar is one Gradle released
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Make help lists every public target
        run: python3 build-tools/test_make_help.py --root . --list '<language>=LANGUAGES' --list '<registry>=REGISTRIES'

      - name: The committed manifests, tagged links and changelogs hold the release's versions
        run: python3 scripts/sdk_version.py check

      - name: Each published README links to sdk at the release's tag
        run: python3 scripts/readme-links.py

      - name: Each Codecov badge reads a component, and each language uploads under a flag of its own
        run: python3 scripts/codecov.py census

      - name: The coming release is not yet tagged on another commit
        run: python3 scripts/sdk_version.py unreleased

      - name: The source archive holds no broken symlink
        run: |
          archive="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive"
          broken="$(find "$archive" -xtype l)"
          test -z "$broken" || { printf 'Broken in the source archive GitHub serves to action users:\n%s\n' "$broken" >&2; exit 1; }

      - name: List the SDK languages to build
        id: languages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          selected="$(bash scripts/languages-to-build.sh "$EVENT")"
          echo "Building: $selected"
          echo "languages=$selected" >> "$GITHUB_OUTPUT"

  artifacts:
    name: ${{ matrix.language }} SDK artifacts from pinned Protocol
    needs: checks
    if: needs.checks.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.checks.outputs.languages) }}
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - name: Check out source and pinned Protocol
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # The toolchain's image and the generator's dune cache are here for the
      # Protocol bundles alone, which some artifacts never read.
      - name: Whether the language's artifact reads the Protocol bundles
        id: bundles
        run: |
          reads="$(bash scripts/reads-protocol-bundles.sh "$LANGUAGE")"
          echo "reads=$reads" >> "$GITHUB_OUTPUT"

      # Restored, the bundles are copied rather than built, and neither the
      # image nor the dune cache is needed. The codegen job saves them.
      - name: Restore the Protocol bundles
        id: protocol-bundles
        if: steps.bundles.outputs.reads == 'true'
        uses: ./.github/actions/restore-protocol-bundles

      - name: Restore the OCaml toolchain's image
        if: steps.bundles.outputs.reads == 'true' && steps.protocol-bundles.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-ocaml-toolchain-image

      # The Protocol bundles are written in the generator's workspace. The
      # codegen job saves its cache.
      - name: Restore dune's build of the generator's locked packages
        if: steps.bundles.outputs.reads == 'true' && steps.protocol-bundles.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-ocaml-dune-cache
        with:
          workspace: codegen

      # The Haskell artifact's container keeps Cabal's home here
      # (scripts/publish-other-local.sh): its index and the dependencies it
      # builds, never the source distribution it writes. Only an exact key
      # restores: the script updates the index only when it has none, and an
      # older home's index may lack what a newer freeze file names. It is
      # saved only after an artifact that verifies.
      - name: Restore the Haskell artifact's Cabal home
        id: cabal
        if: matrix.language == 'haskell'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/xynolog-sdk/local/cabal-cache
          key: ${{ runner.os }}-${{ runner.arch }}-haskell-artifact-${{ hashFiles('haskell/sdk/cabal.project', 'haskell/sdk/cabal.project.freeze') }}

      - name: Build and verify the language's bundle
        id: bundle
        run: |
          make "$LANGUAGE"
          SDK_ARTIFACTS="$(python3 scripts/create-artifact-bundle.py --path "$LANGUAGE")" make verify-artifacts

      # The bundle's packages install as a consumer installs them from the
      # registry, on each runtime they admit at their edges, and a program
      # builds on them.
      - name: The language's packages install in a clean room
        run: bash scripts/clean-room.sh "$LANGUAGE" "$(python3 scripts/create-artifact-bundle.py --path "$LANGUAGE")"

      - name: Save the Haskell artifact's Cabal home
        if: github.event_name == 'push' && matrix.language == 'haskell' && steps.bundle.outcome == 'success' && steps.cabal.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/xynolog-sdk/local/cabal-cache
          key: ${{ steps.cabal.outputs.cache-primary-key }}

  tests:
    name: ${{ matrix.language }} SDK tests and checks
    needs: checks
    if: needs.checks.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.checks.outputs.languages) }}
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - name: Check out source and pinned Protocol
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # Restored, the image is loaded rather than built. This job saves it,
      # once every dependency is built in it, when it had to build it. Its
      # digest, of what the image is built from, keys the caches built in it.
      - name: Restore the Haskell toolchain's image
        id: haskell-image
        if: matrix.language == 'haskell'
        uses: ./.github/actions/restore-haskell-toolchain-image

      # The Haskell target keeps Cabal's home here (scripts/make-target.sh).
      # It is saved once every dependency is built, even when the checks
      # fail: a failing branch is when the next run comes soonest. A store
      # whose dependency build failed or was cut short is never saved: under
      # the key it would be an exact hit that no later run saves over.
      - name: Restore Cabal's index and built dependencies
        id: cabal
        if: matrix.language == 'haskell'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/xynolog/haskell-cabal
          key: ${{ runner.os }}-${{ runner.arch }}-haskell-${{ steps.haskell-image.outputs.digest }}-${{ hashFiles('haskell/sdk/cabal.project', 'haskell/sdk/cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-haskell-

      - name: Build Haskell's dependencies into Cabal's store
        id: dependencies
        if: matrix.language == 'haskell'
        run: bash scripts/make-target.sh haskell-dependencies

      - name: Archive the Haskell toolchain's image
        if: github.event_name == 'push' && steps.dependencies.outcome == 'success' && steps.haskell-image.outputs.cache-hit != 'true'
        env:
          ARCHIVE: ${{ steps.haskell-image.outputs.path }}/image.tar
          IMAGE: ${{ steps.haskell-image.outputs.tag }}
        run: |
          mkdir -p "$(dirname "$ARCHIVE")"
          docker save --output "$ARCHIVE" "$IMAGE"

      - name: Save the Haskell toolchain's image
        if: github.event_name == 'push' && steps.dependencies.outcome == 'success' && steps.haskell-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.haskell-image.outputs.path }}
          key: ${{ steps.haskell-image.outputs.cache-primary-key }}

      # The Haskell target keeps the package's build directory here
      # (scripts/make-target.sh). Each state of the package's sources has a
      # build of its own; the nearest earlier one with the same toolchain,
      # dependencies and package description is restored, and GHC recompiles
      # what changed since. It is saved only after checks that pass, as
      # Gradle's home is.
      - name: Restore the Haskell package's build directory
        id: haskell-build
        if: matrix.language == 'haskell'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/xynolog/haskell-build
          key: ${{ runner.os }}-${{ runner.arch }}-haskell-build-${{ steps.haskell-image.outputs.digest }}-${{ hashFiles('haskell/sdk/cabal.project', 'haskell/sdk/cabal.project.freeze', 'haskell/sdk/xynolog.cabal') }}-${{ hashFiles('haskell/sdk/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-haskell-build-${{ steps.haskell-image.outputs.digest }}-${{ hashFiles('haskell/sdk/cabal.project', 'haskell/sdk/cabal.project.freeze', 'haskell/sdk/xynolog.cabal') }}-

      # The Kotlin target keeps Gradle's home here (scripts/make-target.sh).
      # Gradle fetches what it lacks during the checks, so a home is saved only
      # after checks that pass: one cut short would be an exact hit that no
      # later run saves over, and its missing files fetched on every run.
      - name: Restore Gradle's distribution, plugins and dependencies
        id: gradle
        if: matrix.language == 'kotlin'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/xynolog/kotlin-gradle
          key: ${{ runner.os }}-${{ runner.arch }}-kotlin-${{ hashFiles('kotlin/sdk/gradle/libs.versions.toml', 'kotlin/sdk/gradle/wrapper/gradle-wrapper.properties', 'kotlin/sdk/gradle.lockfile', 'kotlin/sdk/settings-gradle.lockfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-kotlin-

      # The Swift target keeps SwiftPM's build directory here
      # (scripts/make-target.sh). Each toolchain has caches of its own: one
      # compiler's modules are no use to another. It is saved only after checks
      # that pass, as Gradle's home is.
      - name: Restore SwiftPM's checkouts and built dependencies
        id: swift
        if: matrix.language == 'swift'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/xynolog/swift-build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('swift/sdk/.swift-version') }}-${{ hashFiles('swift/sdk/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('swift/sdk/.swift-version') }}-

      # Restored, the bundles are copied rather than built. The codegen job
      # saves them.
      - name: Restore the Protocol bundles
        uses: ./.github/actions/restore-protocol-bundles

      # The target says which dune workspace a run of it builds, if any
      # (scripts/make-target.sh): OCaml's tests build the SDK's, and save its
      # cache once they pass, and the languages that read the Protocol
      # bundles the generator's, when the bundles were not restored. Go's,
      # Swift's and Haskell's run no toolchain container.
      - name: Ask the target which dune workspace it builds
        id: toolchain
        run: bash scripts/make-target.sh --ocaml-toolchain "test-$LANGUAGE" >> "$GITHUB_OUTPUT"

      - name: Restore the OCaml toolchain's image
        if: steps.toolchain.outputs.workspace != 'none'
        uses: ./.github/actions/restore-ocaml-toolchain-image

      - name: Restore dune's build of the workspace's locked packages
        id: dune
        if: steps.toolchain.outputs.workspace != 'none'
        uses: ./.github/actions/restore-ocaml-dune-cache
        with:
          workspace: ${{ steps.toolchain.outputs.workspace }}

      - name: Run the language's tests, type checks, lints and format checks
        id: checks
        run: make "test-$LANGUAGE"

      - name: Save Cabal's index and built dependencies
        if: always() && github.event_name == 'push' && steps.dependencies.outcome == 'success' && steps.cabal.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/xynolog/haskell-cabal
          key: ${{ steps.cabal.outputs.cache-primary-key }}

      - name: Save the Haskell package's build directory
        if: github.event_name == 'push' && matrix.language == 'haskell' && steps.checks.outcome == 'success' && steps.haskell-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/xynolog/haskell-build
          key: ${{ steps.haskell-build.outputs.cache-primary-key }}

      - name: Save Gradle's distribution, plugins and dependencies
        if: github.event_name == 'push' && matrix.language == 'kotlin' && steps.checks.outcome == 'success' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/xynolog/kotlin-gradle
          key: ${{ steps.gradle.outputs.cache-primary-key }}

      - name: Save SwiftPM's checkouts and built dependencies
        if: github.event_name == 'push' && matrix.language == 'swift' && steps.checks.outcome == 'success' && steps.swift.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/xynolog/swift-build
          key: ${{ steps.swift.outputs.cache-primary-key }}

      - name: Save dune's build of the OCaml SDK's locked packages
        if: github.event_name == 'push' && matrix.language == 'ocaml' && steps.checks.outcome == 'success' && steps.dune.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ocaml-dune-cache
        with:
          path: ${{ steps.dune.outputs.path }}
          key: ${{ steps.dune.outputs.cache-primary-key }}

      # The reports the checks wrote into coverage/<language>/, and the flag
      # they count under (codecov.py), for the codecov job. A report the
      # checks did not write fails this job.
      - name: The language's coverage reports, and the flag they count under
        run: python3 scripts/codecov.py upload "$LANGUAGE"

      - name: Keep the language's coverage reports for the codecov job
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.language }}
          path: coverage/${{ matrix.language }}/
          if-no-files-found: error
          retention-days: 1

  # Codecov takes each language's reports under the language's flag, and
  # knows the run by its OIDC token. A pull request from a fork is given no
  # token, and a merge queue's run tests what its pull request's did:
  # neither uploads. Codecov is no part of what CI holds a change to, so a
  # refused upload fails this job alone, and CI Gate does not wait for it.
  codecov:
    name: ${{ matrix.language }} coverage uploaded to Codecov
    needs: [checks, tests]
    if: always() && needs.checks.result == 'success' && needs.checks.outputs.languages != '[]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.checks.outputs.languages) }}
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch the language's coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ matrix.language }}
          path: coverage/${{ matrix.language }}

      - name: The language's coverage reports, and the flag they count under
        id: coverage
        run: python3 scripts/codecov.py upload "$LANGUAGE" >> "$GITHUB_OUTPUT"

      - name: Upload the language's coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: ${{ steps.coverage.outputs.files }}
          flags: ${{ steps.coverage.outputs.flags }}
          disable_search: true
          plugins: noop
          fail_ci_if_error: true

  generated:
    name: Generated files are what their generators write
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and pinned Protocol
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Restore the OCaml toolchain's image
        uses: ./.github/actions/restore-ocaml-toolchain-image

      # The codegen job saves the generator workspace's cache.
      - name: Restore dune's build of the generator's locked packages
        uses: ./.github/actions/restore-ocaml-dune-cache
        with:
          workspace: codegen

      # The codegen job saves the Protocol bundles.
      - name: Restore the Protocol bundles
        uses: ./.github/actions/restore-protocol-bundles

      - name: Check every generation group
        run: make check-generated

  codegen:
    name: The generator's model reads every file of the pinned Protocol, and every sdk path it names is here
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and pinned Protocol
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # Every job that runs an OCaml toolchain container restores its image;
      # this one saves it, once the generator's tests pass, when it built it.
      - name: Restore the OCaml toolchain's image
        id: image
        uses: ./.github/actions/restore-ocaml-toolchain-image

      # Every job that builds the generator's workspace restores its cache;
      # this one saves it, once the generator's tests pass.
      - name: Restore dune's build of the generator's locked packages
        id: dune
        uses: ./.github/actions/restore-ocaml-dune-cache
        with:
          workspace: codegen

      - name: Build, format-check and test the generator
        id: tests
        run: make test-codegen

      - name: Save dune's build of the generator's locked packages
        if: github.event_name == 'push' && steps.tests.outcome == 'success' && steps.dune.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ocaml-dune-cache
        with:
          path: ${{ steps.dune.outputs.path }}
          key: ${{ steps.dune.outputs.cache-primary-key }}

      - name: Archive the OCaml toolchain's image
        if: github.event_name == 'push' && steps.tests.outcome == 'success' && steps.image.outputs.cache-hit != 'true'
        env:
          ARCHIVE: ${{ steps.image.outputs.path }}/image.tar
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$(dirname "$ARCHIVE")"
          docker save --output "$ARCHIVE" "$IMAGE"

      - name: Save the OCaml toolchain's image
        if: github.event_name == 'push' && steps.tests.outcome == 'success' && steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.image.outputs.path }}
          key: ${{ steps.image.outputs.cache-primary-key }}

      # make codegen writes the Protocol bundles: this job saves them, once
      # the bundle verifies, when it built them.
      - name: Restore the Protocol bundles
        id: protocol-bundles
        uses: ./.github/actions/restore-protocol-bundles

      - name: The bundle carries the generator
        id: bundle
        run: |
          make codegen
          SDK_ARTIFACTS="$(python3 scripts/create-artifact-bundle.py --path codegen)" make verify-artifacts

      - name: Save the Protocol bundles
        if: github.event_name == 'push' && steps.bundle.outcome == 'success' && steps.protocol-bundles.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.protocol-bundles.outputs.path }}
          key: ${{ steps.protocol-bundles.outputs.cache-primary-key }}

  tooling:
    name: The repository's own scripts and configs are typechecked and linted
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and build tools
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Typecheck, lint and format-check the tooling
        run: make test-tooling

  # No dependency in any lockfile has a published advisory that advisories.toml
  # does not ignore with a reason, and no ignore outlives its finding
  # (build-tools/advisories.py).
  # The TypeScript workspace commits no lock, so one is resolved for the scan.
  advisories:
    name: No dependency has an advisory nobody judged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install osv-scanner
        run: |
          bash build-tools/install-osv-scanner.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Resolve the TypeScript workspace's lock
        working-directory: typescript
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Scan every lockfile
        run: python3 build-tools/advisories.py --root . --lockfile typescript/package-lock.json

  # cargo-deny's bans and sources checks (rust/deny.toml). Advisories are
  # the advisories job's, with every other lockfile's.
  crates:
    name: Every crate comes from crates.io, by version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      - name: Check the workspace's crates
        working-directory: rust
        run: cargo deny --locked check bans sources

  # What the ruleset requires. It waits for every other job but codecov's,
  # whose service is no part of what CI holds a change to; a census holds that
  # list to the workflow's jobs, and it fails when any of them failed or was
  # cancelled. A job skipped by its own condition passes.
  gate:
    name: CI Gate
    if: always()
    needs: [dco, labels, checks, artifacts, tests, generated, codegen, tooling, advisories, crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/workflows
      - name: The gate waits for every other job but codecov's
        run: |
          jobs="$(yq '.jobs | keys | .[] | select(. != "gate" and . != "codecov")' .github/workflows/ci.yml | sort)"
          waits="$(yq '.jobs.gate.needs[]' .github/workflows/ci.yml | sort)"
          if [ "$jobs" != "$waits" ]; then
            echo "CI Gate's needs differ from the workflow's jobs (< jobs, > needs):" >&2
            diff <(echo "$jobs") <(echo "$waits") >&2
            exit 1
          fi
      # A cache saved by a pull request is restored by that pull request
      # alone, and one saved in the merge queue by nothing: each queue entry
      # has a ref of its own. Only a push to main saves, and every run
      # restores what main saved.
      - name: Every cache is saved by a push to main alone
        run: |
          unguarded="$(yq '.jobs[] | (.steps // [])[] | select((.uses // "") | test("^actions/cache/save@|^[.]/[.]github/actions/save-")) | select((.if // "") | test("github[.]event_name == .push. && ") | not) | .name' .github/workflows/ci.yml)"
          if [ -n "$unguarded" ]; then
            printf 'These steps save a cache on runs other than a push to main:\n%s\n' "$unguarded" >&2
            exit 1
          fi
      - name: Every job it waits for passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
