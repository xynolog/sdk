name: Publish SDK artifact bundle

# Library tagging (versioning R17): a person pushes the signed vX.Y.Z
# (scripts/tag-release.sh), and this builds, verifies and releases the
# nine-language bundle at it. `v*` matches the SDK's tag, not Go's `go/v…`,
# which the person pushes only once this has released the bundle (R16).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  version:
    name: The release this commit names
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: tag
        run: |
          read -r -a tags <<< "$(python3 scripts/sdk_version.py tags)"
          echo "tag=${tags[0]}" >> "$GITHUB_OUTPUT"

  tag:
    needs: version
    permissions:
      contents: read
    uses: xynolog/.github/.github/workflows/release-tag.yml@8e5e3b02c34517d3f8b49645330930983d07b7ac
    with:
      tags: ${{ needs.version.outputs.tag }}

  bundle:
    name: Build and release immutable SDK artifacts
    needs: tag
    runs-on: ubuntu-latest
    # It creates the release and uploads its assets, and reads CI's run for
    # the commit.
    permissions:
      actions: read
      contents: write
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned Protocol
        uses: actions/checkout@v7.0.1
        with:
          # All of it: the release checks ask whether main holds this commit.
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: The commit is ready to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-ready.sh

      - name: Build native packages and bundle
        shell: bash
        run: |
          make build
          SDK_ARTIFACTS="$RUNNER_TEMP/sdk-artifacts" python3 scripts/create-artifact-bundle.py all
          python3 scripts/verify-artifact-bundle.py "$RUNNER_TEMP/sdk-artifacts"

      - name: Create deterministic release archive
        shell: bash
        run: |
          python3 scripts/create-artifact-archive.py \
            "$RUNNER_TEMP/sdk-artifacts" \
            "$RUNNER_TEMP/xynolog-sdk-artifacts-${GITHUB_REF_NAME}.tar.gz"
          cd "$RUNNER_TEMP"
          shasum -a 256 "xynolog-sdk-artifacts-${GITHUB_REF_NAME}.tar.gz" > "xynolog-sdk-artifacts-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Publish the bundle as versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/xynolog-sdk-artifacts-${GITHUB_REF_NAME}.tar.gz"
          checksum="$asset.sha256"
          # opam-repository takes a package's source by URL: the bundle's
          # archive, as an asset of its own, which an opam file's url names
          # with the sha256 artifacts.json records.
          opam="$RUNNER_TEMP/sdk-artifacts/$(jq -r '[.artifacts[] | select(.ecosystem == "opam-source")] | if length == 1 then .[0].path else error("the bundle holds \(length) opam source archives, not one") end' "$RUNNER_TEMP/sdk-artifacts/artifacts.json")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Immutable SDK artifact release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          # The Protocol commit it speaks, read from the submodule: Protocol
          # has no version, and the commit is the whole pin.
          gh release create "$GITHUB_REF_NAME" "$asset" "$checksum" "$opam" \
            --target "$GITHUB_SHA" \
            --title "Xynolog SDK artifacts ${GITHUB_REF_NAME}" \
            --notes "Built from Protocol $(git rev-parse HEAD:protocol)." \
            --generate-notes
